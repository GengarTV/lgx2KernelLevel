PACKAGE_NAME="avermedia-gc550"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="gc550"
DEST_MODULE_LOCATION[0]="/kernel/drivers/media/usb"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build LLVM=\$(grep -qs 'CONFIG_CC_IS_CLANG=y' ${kernel_source_dir}/.config && echo 1 || echo 0) modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
